# Витрина на GitHub Pages: собирает статику и выкладывает её при каждом push.
#
# Это не боевая выкладка. Боевой сайт стоит в корне своего домена, а здесь он
# лежит в подкаталоге с именем репозитория — отсюда NEXT_PUBLIC_BASE_PATH.
# Переменная разъезжается по двум местам сразу: next.config.mjs префиксует
# собственные файлы Next, lib/config.ts — пути к постеру, клипам и логотипу.
#
# .nojekyll обязателен: без него Pages пропускает через Jekyll, а тот молча
# выбрасывает папки, начинающиеся с подчёркивания, — то есть весь _next.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Сборка статики
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
